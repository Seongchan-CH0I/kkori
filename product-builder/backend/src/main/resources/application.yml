spring:
  application:
    name: kkori

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/kkori?characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:kkori}
    password: ${DB_PASSWORD:kkori}
    hikari:
      # 기본값 10. 모듈 0에서는 손대지 않는다.
      # 커넥션 풀 고갈은 모듈 5(스트리밍)에서 측정할 대상이라, 여기서 미리 키우면 병목이 가려진다.
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # 스키마는 Flyway가 만든다. JPA는 절대 건드리지 않는다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

# 서비스의 모든 "하루"는 KST 기준이다. (planner.md 4-1, 4-5)
kkori:
  time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.kkori: DEBUG
