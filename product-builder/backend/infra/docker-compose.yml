services:
  mysql:
    image: mysql:8.4
    container_name: kkori-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kkori
      MYSQL_USER: kkori
      MYSQL_PASSWORD: kkori
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 컨테이너와 세션 시간대를 UTC로 고정한다.
      # "하루"를 KST로 판정하는 책임은 애플리케이션에 두고, DB는 시간대 변환에 끼지 않게 한다.
      - --default-time-zone=+00:00
    volumes:
      - kkori-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kkori-mysql-data:
